name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Alokh-k
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=D4AF37&color_dots=#ebedf0,#d4af37,#c8a032,#b89020,#8c6b00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=D4AF37&color_dots=#2d3343,#5a4a1a,#8c6b00,#b89020,#d4af37

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Generate contribution snake"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
